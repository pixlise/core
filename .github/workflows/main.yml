name: Test and Build Core Image

on:
  workflow_call:
    inputs:
      version_format:
        description: "Version format string used for paulhatch/semantic-version"
        required: true
        default: "${major}.${minor}.${patch}"
        type: string

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      github_sha_short: ${GITHUB_SHA_SHORT}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # - name: GitHub Slug Action
      #   uses: rlespinasse/github-slug-action@v5.7.1
      - name: version
        uses: paulhatch/semantic-version@v6.0.7
        id: version
        with:
          # The prefix to use to identify tags
          tag_prefix: "v"
          # A string which, if present in a git commit, indicates that a change represents a
          # major (breaking) change, supports regular expressions wrapped with '/'
          major_pattern: "(MAJOR)"
          # Same as above except indicating a minor change, supports regular expressions wrapped with '/'
          minor_pattern: "(MINOR)"
          # A string to determine the format of the version output
          version_format: "${{ inputs.version_format }}"
          # Optional path to check for changes. If any changes are detected in the path the
          # 'changed' output will true. Enter multiple paths separated by spaces.
          #change_path: "src/my-service"
          # If this is set to true, *every* commit will be treated as a new version.
          bump_each_commit: false
          # If true, the body of commits will also be searched for major/minor patterns to determine the version type.
          search_commit_body: false
          # The output method used to generate list of users, 'csv' or 'json'.
          user_format_type: "csv"

  code-gen-build:
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.5"
      - name: Generate VIPS lib
        run: |
          echo "Installing libvips quietly..."
          sudo apt-get -qq update
          sudo apt-get -y -qq install libvips-dev
          sudo apt list --installed | grep libvips
          echo "Running genvips..."
          ./genvips.sh
      - name: Generate protobuf
        run: |
          sudo apt -qq install -y protobuf-compiler
          protoc --version
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install github.com/favadi/protoc-go-inject-tag@latest
          ./genproto.sh

      - name: Build executables
        run: |
          mkdir -p _out
          echo "Building executables for version: ${BUILD_VERSION}, sha: ${GITHUB_SHA}..."
          GOOS=linux GOARCH=amd64 go build -ldflags "-X 'github.com/pixlise/core/v4/api/services.ApiVersion=${BUILD_VERSION}' -X 'github.com/pixlise/core/v4/api/services.GitHash=${GITHUB_SHA}'" -o ./_out/pixlise-api-linux ./internal/api
          GOOS=linux GOARCH=amd64 go build -ldflags "-X 'github.com/pixlise/core/v4/api/services.ApiVersion=${BUILD_VERSION}' -X 'github.com/pixlise/core/v4/api/services.GitHash=${GITHUB_SHA}'" -o ./_out/api-integration-test ./internal/cmd-line-tools/api-integration-test
          GOOS=linux GOARCH=amd64 go build -ldflags "-X 'github.com/pixlise/core/v4/api/services.ApiVersion=${BUILD_VERSION}' -X 'github.com/pixlise/core/v4/api/services.GitHash=${GITHUB_SHA}'" -o ./_out/bootstrap ./internal/lambdas/data-import
          GOOS=linux GOARCH=amd64 go build -ldflags "-X 'github.com/pixlise/core/v4/api/services.ApiVersion=${BUILD_VERSION}' -X 'github.com/pixlise/core/v4/api/services.GitHash=${GITHUB_SHA}'" -o ./_out/pixlise-job-node ./internal/cmd-line-tools/job-node
          echo "Copy AWS PEM for builds..."
          wget https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -O global-bundle.pem
          cp ./global-bundle.pem ./_out/
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
      - name: Copy docker build related files
        run: |
          mkdir -p _out-docker
          cp ./Dockerfile ./_out-docker/
          cp ./beam-tool/BGT ./_out-docker/
          cp ./beam-tool/Geometry_PIXL_EM_Landing_25Jan2021.csv ./_out-docker/
      - uses: actions/upload-artifact@v7
        with:
          name: generated-files
          path: |
            ./vips/
            ./generated-protos/
            ./_out/
            ./_out-docker/
            ./api/ws/wsMessage.go
          archive: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  unit-test:
  # NOTE: ubuntu-latest equates to Description:	Ubuntu 24.04.3 LTS on 12 MAR 2026 (while I'm running Ubuntu 25.10)
    runs-on: ubuntu-latest
    needs: [version, code-gen-build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          name: generated-files
      # - name: Check generated stuff exists
      #   run: |
      #     ls -al ./vips
      #     ls -al ./generated-protos
      #     ls -al ./_out
      #     ls -al ./_out-docker
      #     ls -al ./api/ws/
      #     ls -al ./
      - name: Install VIPS lib
        run: |
          echo "Installing libvips quietly..."
          sudo apt-get -qq update
          sudo apt-get -y -qq install libvips-dev
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.5"
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 8
          mongodb-replica-set: testu
          mongodb-port: 27017
      - name: Unit Test (short)
        if: github.ref != 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          make unittest-short # Go tests check for this with "if testing.Short() {...}"
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Unit Test (FULL)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          make unittest-full
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  integration-test:
  # NOTE: ubuntu-latest equates to Description:	Ubuntu 24.04.3 LTS on 12 MAR 2026 (while I'm running Ubuntu 25.10)
    runs-on: ubuntu-latest
    needs: [version, code-gen-build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          name: generated-files
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 8
          mongodb-replica-set: testi
          mongodb-port: 27017
      - name: Integration Test
        # NOTE: integration-test-config.json must have EnvironmentName at the end, so we can append a suffix
        #       to it, to make DB names unique for builds to not clash!
        run: |
          truncate -s-3 ./integration-test-config.json
          UNIX_MS=$(date +%s%N | cut -b1-13)
          echo "_${UNIX_MS}\"}" >> ./integration-test-config.json

          echo "Using build artifacts..."

          cp ./_out/pixlise-api-linux ./api-service
          cp ./_out/api-integration-test ./internal/cmd-line-tools/api-integration-test/tester
          chmod +x ./api-service
          chmod +x ./internal/cmd-line-tools/api-integration-test/tester

          echo "Installing libvips quietly..."
          sudo apt-get -qq update
          sudo apt-get -y -qq install libvips-dev

          echo "Starting PIXLISE API service..."
          ./api-service -customConfigPath ./integration-test-config.json &
          
          echo "Waiting for startup..."
          sleep 5

          echo "Starting integeration test..."
          cd ./internal/cmd-line-tools/api-integration-test
          echo "unittest_${UNIX_MS}"
          ./tester -apiHost localhost:8080 -envName "unittest_${UNIX_MS}" -datasetBucket "integration-test-data-pixlise" -usersBucket "integration-test-users-pixlise" -jobsBucket "integration-test-jobs-pixlise" -uploadBucket "integration-test-upload-pixlise" -auth0Domain ${{ secrets.PIXLISE_API_TEST_AUTH0_DOMAIN }} -auth0ClientId ${{ secrets.PIXLISE_API_TEST_AUTH0_CLIENT_ID }} -auth0Audience "pixlise-backend" -testType "ci" -test1Username "test1@pixlise.org" -test1Password ${{ secrets.TEST_USER_1_PASSWORD }} -test2Username "test2@pixlise.org" -test2Password ${{ secrets.TEST_USER_2_PASSWORD }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PIXLISE_CONFIG_Auth0Domain: ${{ secrets.PIXLISE_API_TEST_AUTH0_DOMAIN }}
          PIXLISE_CONFIG_Auth0ManagementClientID: ${{ secrets.PIXLISE_API_MGMT_AUTH0_CLIENT_ID }}
          PIXLISE_CONFIG_Auth0ManagementSecret: ${{ secrets.PIXLISE_API_MGMT_AUTH0_SECRET }}
          PIXLISE_CONFIG_ZenodoAccessToken: ${{ secrets.ZENODO_ACCESS_TOKEN }}

  publish-lambda:
    runs-on: ubuntu-latest
    needs: [version, code-gen-build]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-files
      - name: Print Version
        run: |
          echo "BUILDING VERSION ${{ needs.version.outputs.version }}"
          echo "Tag name: ${{ needs.version.outputs.version_tag }}"
      - name: Copy to S3 Archive
        run: |
          cd _out
          mkdir -p dataimport integrationtest
          zip -q dataimport/dataimport-linux-${{ needs.version.outputs.version }}.zip global-bundle.pem bootstrap
          rm bootstrap

          mv pixlise-job-node pixlise-job-node-${{ needs.version.outputs.version }}
          mkdir -p pixlise-job-node
          cp pixlise-job-node-${{ needs.version.outputs.version }} ./pixlise-job-node
          mv pixlise-job-node-${{ needs.version.outputs.version }} ./pixlise-job-node/pixlise-job-node
          aws s3 cp . s3://corestack-buildartifactsf774a77d-105on4pno9pjm/ --recursive --region us-east-1

  publish-api-docker:
    needs: [version, code-gen-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-files
      - name: Print Version
        run: |
          echo "BUILDING VERSION ${{ needs.version.outputs.version }}"

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      # - name: Install cosign
      #   if: github.event_name != 'pull_request'
      #   uses: sigstore/cosign-installer@v2.8.1
      #   with:
      #     cosign-release: "v1.9.0"

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4.3.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ needs.version.outputs.version }}

      - name: Copy docker file
        run: cp ./_out-docker/Dockerfile ./

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-contexts: |
            build-outputs=./_out
            other-files=./_out-docker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            GITHUB_SHA=${{ needs.version.outputs.github_sha_short }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      # - name: Sign the published Docker image
      #   if: ${{ github.event_name != 'pull_request' }}
      #   env:
      #     COSIGN_EXPERIMENTAL: "true"
      #   # This step uses the identity token to provision an ephemeral certificate
      #   # against the sigstore community Fulcio instance.
      #   run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign {}@${{ steps.build-and-push.outputs.digest }}
